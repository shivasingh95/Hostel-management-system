# ===================== Server =====================
server.port=8080

# ===================== Database =====================
# Create the DB first: CREATE DATABASE hostel_db;
spring.datasource.url=jdbc:mysql://localhost:3306/hostel_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / Hibernate =====================
# 'update' auto-creates/updates tables from your entities during development.
# Switch to 'validate' once your schema is stable, and use proper migrations
# (e.g. Flyway) for anything beyond a course project.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================== JWT =====================
# In a real deployment, move this secret to an environment variable —
# never commit a real secret to Git. This one is a placeholder.
jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS
jwt.expiration-ms=86400000

# ===================== Logging =====================
logging.level.com.hostel.management=DEBUG
logging.level.org.springframework.security=INFO
